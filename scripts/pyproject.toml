[project]
name = "intel-image-generator"
version = "0.1.0"
description = "Generate local images with OpenVINO"
readme = "README.md"
authors = [
    { name = "Alex Karev", email = "alexkarev@sjtu.edu.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "filelock>=4.2.4",
    "optimum-intel[diffusers,openvino]>=1.27.0",
    "pillow>=13.0.0",
    "torch",
    "torchvision",
]

[project.scripts]
intel-image-generator = "intel_image_generator.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
